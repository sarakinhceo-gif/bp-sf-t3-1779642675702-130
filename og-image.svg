<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="865" cy="-19" r="25" fill="#16213e" opacity="0.07"/>
    <circle cx="790" cy="431" r="35" fill="#16213e" opacity="0.08"/>
    <circle cx="81" cy="710" r="83" fill="#16213e" opacity="0.17"/>
    <circle cx="520" cy="-98" r="60" fill="#16213e" opacity="0.16"/>
    <circle cx="821" cy="295" r="24" fill="#16213e" opacity="0.18"/>
    <circle cx="1122" cy="239" r="48" fill="#16213e" opacity="0.20"/>
    <rect x="195" y="35" width="87" height="78" rx="8" fill="#1a1a2e" opacity="0.15" transform="rotate(36, 371, 40)"/>
    <rect x="1094" y="224" width="74" height="75" rx="8" fill="#1a1a2e" opacity="0.06" transform="rotate(4, 573, 360)"/>
    <rect x="1170" y="386" width="85" height="34" rx="8" fill="#1a1a2e" opacity="0.11" transform="rotate(12, 620, 151)"/>
    <rect x="1185" y="18" width="97" height="32" rx="8" fill="#1a1a2e" opacity="0.14" transform="rotate(17, 966, 681)"/>
    <rect x="503" y="-21" width="58" height="20" rx="8" fill="#1a1a2e" opacity="0.03" transform="rotate(33, 61, 394)"/>
    <rect x="1283" y="-55" width="49" height="46" rx="8" fill="#1a1a2e" opacity="0.13" transform="rotate(0, 634, 486)"/>
    <rect x="790" y="468" width="79" height="20" rx="8" fill="#1a1a2e" opacity="0.06" transform="rotate(0, 526, -88)"/>
    <rect x="851" y="235" width="73" height="68" rx="8" fill="#1a1a2e" opacity="0.08" transform="rotate(15, 139, 474)"/>
    <polygon points="176,85 217,167 135,167" fill="#16213e" opacity="0.08"/>
    <polygon points="27,176 79,280 -25,280" fill="#16213e" opacity="0.08"/>
    <polygon points="538,227 601,353 475,353" fill="#16213e" opacity="0.05"/>
    <polygon points="1271,518 1355,686 1187,686" fill="#16213e" opacity="0.05"/>

  <!-- Wave at bottom -->
  <path d="M0,548 C360,589 840,507 1200,548 L1200,630 L0,630Z" fill="#16213e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 주식투자
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#e94560" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#e94560" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포 셔츠룸 — 주식투자
  </text>
</svg>